name: "get_calendar_events"
display_name: "Calendar (iCloud & Google)"
description: "Read calendar events for today, tomorrow, this weekend, or any date range. Supports iCloud CalDAV and Google Calendar. Includes upcoming event alert agent."
version: "0.1.5"
min_jarvis_version: "0.1.115"
# Node v0.1.115 is the first release with floor enforcement AND secret
# value_type "user" (needed for CALENDAR_AGENT_USER); SDK 0.3.4 likewise.
min_sdk_version: "0.7.0"
license: Apache-2.0
author:
  github: "alexberardi"
categories: ["productivity", "calendar"]
platforms: ["darwin", "linux"]
keywords: ["calendar", "events", "schedule", "icloud", "google calendar", "appointments", "meetings"]

packages:
  - name: caldav
  - name: httpx

secrets:
  - key: CALENDAR_TYPE
    scope: user
    value_type: string
    description: "Calendar provider: 'icloud' (default) or 'google'"
    is_sensitive: false
  - key: CALENDAR_DEFAULT_NAME
    scope: user
    value_type: string
    description: "Default calendar name to use"
    is_sensitive: false
  - key: CALENDAR_USERNAME
    scope: user
    value_type: string
    description: "iCloud username/Apple ID"
    is_sensitive: false
  - key: CALENDAR_PASSWORD
    scope: user
    value_type: string
    description: "iCloud app-specific password"
  - key: GOOGLE_CLIENT_ID
    scope: integration
    value_type: string
    description: "Google OAuth client ID (optional — default provided)"
    is_sensitive: false
  - key: GOOGLE_ACCESS_TOKEN
    scope: user
    value_type: string
    description: "Google OAuth access token (auto-populated)"
  - key: GOOGLE_REFRESH_TOKEN
    scope: user
    value_type: string
    description: "Google OAuth refresh token (auto-populated)"
  - key: CALENDAR_AGENT_USER
    scope: integration
    value_type: user
    description: "The household member whose calendar the alert agent watches. Leave unset to watch every member with a configured calendar."
    is_sensitive: false
